<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 은 반드시 7.x (8.x는 인라인 text/babel 처리가 깨짐) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in { animation: pop-in 0.18s ease-out; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // ========================================
    // 📦 Constants & Static Lookup Tables
    // (포켓몬 데이터는 이제 이 프로젝트의 자체 서버(server.js, /api/pokemons)에서 가져옵니다.
    //  PokeAPI는 더 이상 호출하지 않습니다. 여기 있는 건 UI 라벨/색상용 고정 테이블 뿐입니다)
    // ========================================
    const API_BASE = '/api';

    const TYPE_INFO = {
      normal: { ko: '노말', bg: 'bg-neutral-400', text: 'text-white' },
      fighting: { ko: '격투', bg: 'bg-red-700', text: 'text-white' },
      flying: { ko: '비행', bg: 'bg-indigo-300', text: 'text-slate-900' },
      poison: { ko: '독', bg: 'bg-purple-500', text: 'text-white' },
      ground: { ko: '땅', bg: 'bg-amber-600', text: 'text-white' },
      rock: { ko: '바위', bg: 'bg-yellow-700', text: 'text-white' },
      bug: { ko: '벌레', bg: 'bg-lime-500', text: 'text-slate-900' },
      ghost: { ko: '고스트', bg: 'bg-indigo-700', text: 'text-white' },
      steel: { ko: '강철', bg: 'bg-slate-400', text: 'text-slate-900' },
      fire: { ko: '불꽃', bg: 'bg-orange-500', text: 'text-white' },
      water: { ko: '물', bg: 'bg-sky-500', text: 'text-white' },
      grass: { ko: '풀', bg: 'bg-green-500', text: 'text-white' },
      electric: { ko: '전기', bg: 'bg-yellow-400', text: 'text-slate-900' },
      psychic: { ko: '에스퍼', bg: 'bg-pink-500', text: 'text-white' },
      ice: { ko: '얼음', bg: 'bg-cyan-300', text: 'text-slate-900' },
      dragon: { ko: '드래곤', bg: 'bg-violet-700', text: 'text-white' },
      dark: { ko: '악', bg: 'bg-neutral-700', text: 'text-white' },
      fairy: { ko: '페어리', bg: 'bg-pink-300', text: 'text-slate-900' },
      stellar: { ko: '스텔라', bg: 'bg-teal-400', text: 'text-slate-900' },
      unknown: { ko: '???', bg: 'bg-slate-300', text: 'text-slate-900' },
    };

    const STAT_LABELS = {
      hp: 'HP',
      attack: '공격',
      defense: '방어',
      'special-attack': '특수공격',
      'special-defense': '특수방어',
      speed: '스피드',
    };
    const STAT_COLORS = {
      hp: 'bg-emerald-500',
      attack: 'bg-rose-500',
      defense: 'bg-blue-500',
      'special-attack': 'bg-fuchsia-500',
      'special-defense': 'bg-indigo-500',
      speed: 'bg-amber-500',
    };

    // ========================================
    // 🛠 Utility Helpers
    // ========================================
    function capitalizeName(name) {
      return name
        .split('-')
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      const body = await res.json().catch(() => null);
      if (!res.ok || !body || body.success === false) {
        throw new Error((body && body.message) || '서버 요청에 실패했습니다');
      }
      return body.data;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-red-500 text-white hover:bg-red-600 active:bg-red-700 focus:ring-red-400',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-400',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-100 focus:ring-slate-200',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm gap-1',
        md: 'px-4 py-2 text-sm gap-1.5',
        lg: 'px-5 py-2.5 text-base gap-2',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', icon = null }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="mb-1 block text-sm font-medium text-slate-700">{label}</span>}
          <div className="relative">
            {icon && (
              <span className="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                {icon}
              </span>
            )}
            <input
              type={type}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              disabled={disabled}
              className={`w-full rounded-xl border bg-white py-2.5 ${icon ? 'pl-10' : 'pl-4'} pr-4 text-sm text-slate-900 placeholder-slate-400 shadow-sm transition focus:outline-none focus:ring-2 disabled:bg-slate-100
                ${error ? 'border-rose-400 focus:ring-rose-300' : 'border-slate-200 focus:ring-red-300 focus:border-red-400'}`}
            />
          </div>
          {error && <span className="mt-1 block text-xs text-rose-500">{error}</span>}
        </label>
      );
    }

    function Card({ children, className = '', onClick }) {
      return (
        <div
          onClick={onClick}
          className={`rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 ${onClick ? 'cursor-pointer hover:-translate-y-1 hover:shadow-lg' : ''} transition-all duration-200 ${className}`}
        >
          {children}
        </div>
      );
    }

    function Badge({ children, typeName, className = '' }) {
      const style = TYPE_INFO[typeName] || TYPE_INFO.unknown;
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-bold ${style.bg} ${style.text} ${className}`}>
          {children}
        </span>
      );
    }

    function Spinner({ className = 'h-5 w-5' }) {
      return (
        <svg className={`animate-spin text-red-500 ${className}`} viewBox="0 0 24 24" fill="none">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.addEventListener('keydown', handleKeyDown);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = {
        sm: 'max-w-sm',
        md: 'max-w-md',
        lg: 'max-w-2xl',
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={title}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className={`w-full ${sizes[size]} animate-pop-in overflow-hidden rounded-2xl bg-white shadow-2xl`}
          >
            <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
              <h2 className="text-lg font-bold text-slate-900">{title}</h2>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="rounded-full p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-300"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div className="max-h-[75vh] overflow-y-auto px-5 py-4">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header({ searchTerm, onSearchChange, resultCount, totalCount }) {
      return (
        <header className="sticky top-0 z-40 bg-gradient-to-r from-red-500 to-red-600 shadow-md">
          <div className="mx-auto max-w-5xl px-4 py-5 sm:px-6">
            <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
              <div className="flex items-center gap-3">
                <div className="flex h-11 w-11 items-center justify-center rounded-full bg-white shadow-inner ring-4 ring-red-300/60">
                  <div className="h-4 w-4 rounded-full bg-sky-400 ring-2 ring-slate-800" />
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight text-white sm:text-2xl">포켓몬 도감</h1>
                  <p className="text-xs text-red-100 sm:text-sm">
                    {totalCount ? `${totalCount}마리 수록` : ''} · 자체 서버(server.js) API 데이터
                  </p>
                </div>
              </div>
              <div className="sm:w-72">
                <Input
                  value={searchTerm}
                  onChange={(e) => onSearchChange(e.target.value)}
                  placeholder="이름(한글/영문) 또는 도감번호 검색"
                  icon={
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <circle cx="11" cy="11" r="7" />
                      <path strokeLinecap="round" d="M21 21l-4.35-4.35" />
                    </svg>
                  }
                  className="[&>span]:hidden"
                />
                <p className="mt-1 text-right text-xs text-red-100">{resultCount}마리 검색됨</p>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="mx-auto max-w-5xl px-4 py-8 text-center text-xs text-slate-400 sm:px-6">
          모든 포켓몬 데이터는 이 프로젝트의 자체 Node.js 서버(<code className="rounded bg-slate-200 px-1 py-0.5">server.js</code>)가
          제공하는 API에서 불러옵니다 (PokeAPI 미사용)
        </footer>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function StatBar({ label, value, max = 200, colorClass }) {
      const percent = Math.min(100, Math.round((value / max) * 100));
      return (
        <div>
          <div className="mb-1 flex items-center justify-between text-xs font-medium text-slate-600">
            <span>{label}</span>
            <span className="font-bold text-slate-800">{value}</span>
          </div>
          <div className="h-2 w-full overflow-hidden rounded-full bg-slate-100">
            <div className={`h-full rounded-full ${colorClass}`} style={{ width: `${percent}%` }} />
          </div>
        </div>
      );
    }

    function PokemonCard({ pokemon, onSelect }) {
      return (
        <Card onClick={() => onSelect(pokemon.id)} className="ring-1 ring-slate-200">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-400">#{String(pokemon.id).padStart(4, '0')}</span>
            <div className="flex gap-1">
              {pokemon.types.map((t) => (
                <Badge key={t} typeName={t}>
                  {TYPE_INFO[t] ? TYPE_INFO[t].ko : t}
                </Badge>
              ))}
            </div>
          </div>
          <div className="flex justify-center py-2">
            <img
              src={pokemon.image}
              alt={pokemon.nameKo || capitalizeName(pokemon.nameEn)}
              loading="lazy"
              className="h-28 w-28 object-contain drop-shadow-md transition-transform duration-200 hover:scale-105"
            />
          </div>
          <h3 className="text-center text-base font-bold text-slate-800">{pokemon.nameKo || capitalizeName(pokemon.nameEn)}</h3>
          <p className="text-center text-xs text-slate-400">{capitalizeName(pokemon.nameEn)}</p>
        </Card>
      );
    }

    function PokemonGrid({ pokemons, onSelect }) {
      if (pokemons.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-200 bg-white/60 py-16 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" className="mb-3 h-10 w-10 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <circle cx="11" cy="11" r="7" />
              <path strokeLinecap="round" d="M21 21l-4.35-4.35" />
            </svg>
            <p className="text-sm font-medium text-slate-500">검색 결과가 없어요</p>
            <p className="mt-1 text-xs text-slate-400">다른 이름이나 도감번호로 검색해보세요</p>
          </div>
        );
      }

      return (
        <div className="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
          {pokemons.map((p) => (
            <PokemonCard key={p.id} pokemon={p} onSelect={onSelect} />
          ))}
        </div>
      );
    }

    function PokemonDetailModal({ isOpen, onClose, loading, error, detail, onRetry }) {
      const primaryType = detail && detail.types[0];
      const style = primaryType ? TYPE_INFO[primaryType] || TYPE_INFO.unknown : null;

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={detail ? detail.nameKo : '포켓몬 정보'} size="md">
          {loading && (
            <div className="flex flex-col items-center justify-center gap-3 py-16">
              <Spinner className="h-8 w-8" />
              <p className="text-sm text-slate-400">데이터를 불러오는 중...</p>
            </div>
          )}

          {!loading && error && (
            <div className="flex flex-col items-center justify-center gap-3 py-16 text-center">
              <p className="text-sm font-medium text-rose-500">{error}</p>
              <Button variant="secondary" size="sm" onClick={onRetry}>다시 시도</Button>
            </div>
          )}

          {!loading && !error && detail && (
            <React.Fragment>
              <div className={`-mx-5 -mt-4 mb-4 flex flex-col items-center gap-1 px-5 py-6 ${style ? style.bg + '/10' : 'bg-slate-50'}`}>
                <span className="text-xs font-bold text-slate-400">#{String(detail.id).padStart(4, '0')}</span>
                <img
                  src={detail.image}
                  alt={detail.nameKo}
                  className="h-36 w-36 object-contain drop-shadow-lg"
                />
                <h3 className="text-xl font-extrabold text-slate-800">{detail.nameKo}</h3>
                <p className="text-xs text-slate-400">{capitalizeName(detail.nameEn)}</p>
                <div className="mt-1 flex gap-2">
                  {detail.types.map((t) => (
                    <Badge key={t} typeName={t}>{TYPE_INFO[t] ? TYPE_INFO[t].ko : t}</Badge>
                  ))}
                </div>
              </div>

              <p className="mb-5 rounded-xl bg-slate-50 px-4 py-3 text-sm leading-relaxed text-slate-600">
                {detail.description}
              </p>

              <div className="mb-5 grid grid-cols-2 gap-3 text-center">
                <div className="rounded-xl bg-slate-50 py-2.5">
                  <p className="text-xs text-slate-400">키</p>
                  <p className="text-sm font-bold text-slate-700">{detail.height.toFixed(1)}m</p>
                </div>
                <div className="rounded-xl bg-slate-50 py-2.5">
                  <p className="text-xs text-slate-400">몸무게</p>
                  <p className="text-sm font-bold text-slate-700">{detail.weight.toFixed(1)}kg</p>
                </div>
              </div>

              <div className="space-y-3">
                <p className="text-sm font-bold text-slate-700">기본 능력치</p>
                {Object.entries(detail.stats).map(([key, value]) => (
                  <StatBar key={key} label={STAT_LABELS[key] || key} value={value} colorClass={STAT_COLORS[key] || 'bg-slate-400'} />
                ))}
              </div>
            </React.Fragment>
          )}
        </Modal>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [pokemons, setPokemons] = useState([]);
      const [listLoading, setListLoading] = useState(true);
      const [listError, setListError] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');

      const [selectedId, setSelectedId] = useState(null);
      const [detailsCache, setDetailsCache] = useState({});
      const [detailLoading, setDetailLoading] = useState(false);
      const [detailError, setDetailError] = useState(null);

      // 자체 서버(server.js)의 /api/pokemons 에서 목록을 불러온다
      useEffect(() => {
        let cancelled = false;

        async function init() {
          try {
            const list = await fetchJson(`${API_BASE}/pokemons`);
            if (!cancelled) {
              setPokemons(list);
              setListLoading(false);
            }
          } catch (err) {
            if (!cancelled) {
              setListError(err.message || '알 수 없는 오류가 발생했습니다');
              setListLoading(false);
            }
          }
        }

        init();
        return () => {
          cancelled = true;
        };
      }, []);

      const filteredList = useMemo(() => {
        const term = searchTerm.trim().toLowerCase();
        if (!term) return pokemons;
        return pokemons.filter((p) => (
          p.nameEn.toLowerCase().includes(term) ||
          String(p.id).includes(term) ||
          (p.nameKo && p.nameKo.toLowerCase().includes(term))
        ));
      }, [pokemons, searchTerm]);

      const loadDetail = useCallback(
        async (id) => {
          setSelectedId(id);
          setDetailError(null);

          if (detailsCache[id]) return;

          setDetailLoading(true);
          try {
            const detail = await fetchJson(`${API_BASE}/pokemons/${id}`);
            setDetailsCache((prev) => ({ ...prev, [id]: detail }));
          } catch (err) {
            setDetailError(err.message || '상세 정보를 불러오지 못했습니다');
          } finally {
            setDetailLoading(false);
          }
        },
        [detailsCache]
      );

      return (
        <div className="min-h-screen bg-slate-100">
          <Header
            searchTerm={searchTerm}
            onSearchChange={setSearchTerm}
            resultCount={filteredList.length}
            totalCount={pokemons.length}
          />

          <main className="mx-auto max-w-5xl px-4 py-6 sm:px-6">
            {listLoading && (
              <div className="flex flex-col items-center justify-center gap-3 py-24">
                <Spinner className="h-8 w-8" />
                <p className="text-sm text-slate-400">포켓몬 목록을 불러오는 중...</p>
              </div>
            )}

            {!listLoading && listError && (
              <div className="flex flex-col items-center justify-center gap-3 py-24 text-center">
                <p className="text-sm font-medium text-rose-500">{listError}</p>
                <p className="text-xs text-slate-400">서버(server.js)가 실행 중인지 확인해주세요 (node server.js)</p>
                <Button variant="secondary" size="sm" onClick={() => window.location.reload()}>다시 시도</Button>
              </div>
            )}

            {!listLoading && !listError && (
              <PokemonGrid pokemons={filteredList} onSelect={loadDetail} />
            )}
          </main>

          <Footer />

          <PokemonDetailModal
            isOpen={selectedId !== null}
            onClose={() => setSelectedId(null)}
            loading={detailLoading}
            error={detailError}
            detail={selectedId !== null ? detailsCache[selectedId] : null}
            onRetry={() => loadDetail(selectedId)}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
