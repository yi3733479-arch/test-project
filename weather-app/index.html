<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 날씨</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 은 반드시 7.x (8.x는 인라인 text/babel 처리가 깨짐) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes float-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: float-slow 4s ease-in-out infinite; }
    ::-webkit-scrollbar { height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ========================================
    // 📦 Constants
    // ========================================
    // ⚠️ 개인 API 키가 하드코딩되어 있습니다. 이 파일을 공개 저장소/공개 웹에
    // 올리면 키가 그대로 노출되니, 개인 로컬 사용 용도로만 사용하세요.
    // 설정(⚙️) 화면에서 언제든 다른 키로 교체하거나 지울 수 있습니다.
    const DEFAULT_API_KEY = 'c14334f470c3279abeca118a95b76b78';

    const API_KEY_STORAGE = 'owm_api_key';
    const LOCATION_STORAGE = 'owm_last_location';

    const DEFAULT_LOCATION = { lat: 37.5665, lon: 126.978, name: '서울특별시', country: 'KR' };

    // ========================================
    // 🌐 OpenWeatherMap API Helpers
    // ========================================
    async function fetchJson(url) {
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) {
        const message = (data && data.message) || `요청에 실패했습니다 (${res.status})`;
        throw new Error(message);
      }
      return data;
    }

    function geocodeByName(name, apiKey) {
      const url = `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(name)}&limit=5&appid=${apiKey}`;
      return fetchJson(url);
    }

    function reverseGeocode(lat, lon, apiKey) {
      const url = `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${apiKey}`;
      return fetchJson(url);
    }

    function fetchCurrentWeather(lat, lon, apiKey) {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=kr&appid=${apiKey}`;
      return fetchJson(url);
    }

    function fetchForecast(lat, lon, apiKey) {
      const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=kr&appid=${apiKey}`;
      return fetchJson(url);
    }

    // ========================================
    // 🛠 Utility Helpers
    // ========================================
    function toDisplayTemp(celsius, unit) {
      const value = unit === 'F' ? (celsius * 9) / 5 + 32 : celsius;
      return Math.round(value);
    }

    function readCache(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function writeCache(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // 저장 실패는 무시 (프라이빗 모드 등)
      }
    }

    function iconUrl(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }

    // tz(초) 만큼 보정된 "현지 시각" Date를 만들고, 이후 항상 getUTC*로 읽어야 이중 보정이 안 생김
    function toLocalDate(unixSeconds, tzOffsetSeconds) {
      return new Date((unixSeconds + tzOffsetSeconds) * 1000);
    }

    function dateKey(localDate) {
      return `${localDate.getUTCFullYear()}-${localDate.getUTCMonth()}-${localDate.getUTCDate()}`;
    }

    function formatDayLabel(localDate, todayKey) {
      if (dateKey(localDate) === todayKey) return '오늘';
      const tomorrow = new Date(localDate);
      // todayKey 비교로 충분하므로 요일만 계산
      return new Intl.DateTimeFormat('ko-KR', { weekday: 'short', timeZone: 'UTC' }).format(localDate) + '요일';
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-full transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-white text-sky-600 hover:bg-sky-50 focus:ring-white',
        secondary: 'bg-white/20 text-white hover:bg-white/30 focus:ring-white/60',
        ghost: 'bg-transparent text-white/80 hover:bg-white/10 focus:ring-white/40',
        solid: 'bg-sky-500 text-white hover:bg-sky-600 focus:ring-sky-300',
      };
      const sizes = {
        sm: 'px-3 py-1 text-xs',
        md: 'px-4 py-1.5 text-sm',
        lg: 'px-5 py-2 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ value, onChange, placeholder, disabled = false, className = '', onKeyDown }) {
      return (
        <input
          type="text"
          value={value}
          onChange={onChange}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          disabled={disabled}
          className={`w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 shadow-sm transition focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-300 disabled:bg-slate-100 ${className}`}
        />
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 ${className}`}>
          {children}
        </span>
      );
    }

    function Spinner({ className = 'h-5 w-5' }) {
      return (
        <svg className={`animate-spin text-white ${className}`} viewBox="0 0 24 24" fill="none">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      );
    }

    function Modal({ isOpen, onClose, title, children }) {
      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.addEventListener('keydown', handleKeyDown);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={title}
        >
          <div onClick={(e) => e.stopPropagation()} className="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
              <h2 className="text-lg font-bold text-slate-900">{title}</h2>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="rounded-full p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-300"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div className="max-h-[75vh] overflow-y-auto px-5 py-4">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header({ locationName, unit, onToggleUnit, onOpenSettings }) {
      const todayLabel = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
      return (
        <header className="mx-auto flex max-w-3xl items-center justify-between px-4 pt-6 sm:px-6">
          <div>
            <h1 className="text-lg font-bold text-white sm:text-xl">📍 {locationName}</h1>
            <p className="text-sm text-sky-100">{todayLabel}</p>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex overflow-hidden rounded-full bg-white/20 text-xs font-bold text-white">
              <button
                onClick={() => onToggleUnit('C')}
                className={`px-3 py-1.5 transition ${unit === 'C' ? 'bg-white text-sky-600' : 'hover:bg-white/10'}`}
              >
                °C
              </button>
              <button
                onClick={() => onToggleUnit('F')}
                className={`px-3 py-1.5 transition ${unit === 'F' ? 'bg-white text-sky-600' : 'hover:bg-white/10'}`}
              >
                °F
              </button>
            </div>
            <button
              onClick={onOpenSettings}
              aria-label="API 키 설정"
              className="rounded-full bg-white/20 p-2 text-white transition hover:bg-white/30"
            >
              ⚙️
            </button>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="mx-auto max-w-3xl px-4 py-8 text-center text-xs text-sky-100/80 sm:px-6">
          날씨 데이터 제공:{' '}
          <a href="https://openweathermap.org" target="_blank" rel="noreferrer" className="underline hover:text-white">
            OpenWeatherMap
          </a>
        </footer>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function ApiKeySetup({ initialValue, onSave }) {
      const [value, setValue] = useState(initialValue || '');
      return (
        <div className="flex min-h-screen items-center justify-center px-4">
          <Card className="w-full max-w-sm text-center">
            <p className="text-3xl">🔑</p>
            <h2 className="mt-2 text-lg font-bold text-slate-800">OpenWeatherMap API 키가 필요해요</h2>
            <p className="mt-1 text-sm text-slate-500">
              무료 API 키를{' '}
              <a href="https://openweathermap.org/api" target="_blank" rel="noreferrer" className="font-semibold text-sky-600 underline">
                openweathermap.org
              </a>
              에서 발급받아 입력하세요.
            </p>
            <div className="mt-4 text-left">
              <Input value={value} onChange={(e) => setValue(e.target.value)} placeholder="API 키를 입력하세요" />
            </div>
            <Button variant="solid" size="md" className="mt-4 w-full" disabled={!value.trim()} onClick={() => onSave(value)}>
              저장하고 시작하기
            </Button>
          </Card>
        </div>
      );
    }

    function SettingsModal({ isOpen, onClose, currentKey, onSave, onClear }) {
      const [value, setValue] = useState(currentKey || '');
      useEffect(() => {
        if (isOpen) setValue(currentKey || '');
      }, [isOpen, currentKey]);

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="API 키 설정">
          <p className="mb-3 text-sm text-slate-500">
            <a href="https://openweathermap.org/api" target="_blank" rel="noreferrer" className="text-sky-600 underline">
              openweathermap.org
            </a>
            에서 발급받은 키를 입력하세요.
          </p>
          <Input value={value} onChange={(e) => setValue(e.target.value)} placeholder="API 키" />
          <div className="mt-4 flex gap-2">
            <Button variant="solid" size="sm" className="flex-1" disabled={!value.trim()} onClick={() => onSave(value)}>
              저장
            </Button>
            <Button variant="ghost" size="sm" className="!text-rose-500 hover:!bg-rose-50" onClick={onClear}>
              키 삭제
            </Button>
          </div>
        </Modal>
      );
    }

    function CitySearchBar({ searchTerm, onSearchTermChange, onSearch, searching, results, onSelectResult, onUseMyLocation, locating, searchError }) {
      return (
        <section className="mx-auto max-w-3xl px-4 pt-4 sm:px-6">
          <form onSubmit={onSearch} className="flex gap-2">
            <div className="flex-1">
              <Input
                value={searchTerm}
                onChange={(e) => onSearchTermChange(e.target.value)}
                placeholder="도시 검색 (예: Seoul, Busan, Tokyo)"
              />
            </div>
            <Button type="submit" variant="secondary" size="md" disabled={searching}>
              {searching ? <Spinner className="h-4 w-4" /> : '검색'}
            </Button>
            <Button type="button" variant="secondary" size="md" onClick={onUseMyLocation} disabled={locating}>
              {locating ? <Spinner className="h-4 w-4" /> : '📍 내 위치'}
            </Button>
          </form>

          {searchError && <p className="mt-2 text-sm font-medium text-rose-100">{searchError}</p>}

          {results.length > 0 && (
            <Card className="mt-2 divide-y divide-slate-100 p-0">
              {results.map((r, i) => (
                <button
                  key={i}
                  onClick={() => onSelectResult(r)}
                  className="flex w-full items-center justify-between px-4 py-2.5 text-left text-sm hover:bg-slate-50"
                >
                  <span className="font-medium text-slate-700">
                    {(r.local_names && r.local_names.ko) || r.name}
                    {r.state ? `, ${r.state}` : ''}
                  </span>
                  <span className="text-xs text-slate-400">{r.country}</span>
                </button>
              ))}
            </Card>
          )}
        </section>
      );
    }

    function CurrentWeatherHero({ current, unit }) {
      const weather = current.weather[0];
      return (
        <div className="mx-auto max-w-3xl px-4 pb-2 pt-4 text-center text-white sm:px-6">
          <img src={iconUrl(weather.icon)} alt={weather.description} className="animate-float mx-auto h-32 w-32 drop-shadow-lg" />
          <p className="mt-1 text-6xl font-extrabold tracking-tight sm:text-7xl">
            {toDisplayTemp(current.main.temp, unit)}°{unit}
          </p>
          <p className="mt-1 text-lg font-medium capitalize text-sky-50">{weather.description}</p>
          <p className="mt-1 text-sm text-sky-100">
            체감 {toDisplayTemp(current.main.feels_like, unit)}°{unit} · 최고 {toDisplayTemp(current.main.temp_max, unit)}° · 최저{' '}
            {toDisplayTemp(current.main.temp_min, unit)}°
          </p>
        </div>
      );
    }

    function WeatherDetailsGrid({ current }) {
      const tz = current.timezone || 0;
      const sunrise = toLocalDate(current.sys.sunrise, tz);
      const sunset = toLocalDate(current.sys.sunset, tz);
      const timeFmt = (d) =>
        `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;

      const details = [
        { label: '습도', value: `${current.main.humidity}%`, icon: '💧' },
        { label: '바람', value: `${current.wind.speed}m/s`, icon: '🍃' },
        { label: '구름량', value: `${current.clouds.all}%`, icon: '☁️' },
        { label: '기압', value: `${current.main.pressure}hPa`, icon: '📊' },
        { label: '일출', value: timeFmt(sunrise), icon: '🌅' },
        { label: '일몰', value: timeFmt(sunset), icon: '🌇' },
      ];
      return (
        <section className="mx-auto max-w-3xl px-4 sm:px-6">
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
            {details.map((d) => (
              <Card key={d.label} className="text-center">
                <p className="text-xl">{d.icon}</p>
                <p className="mt-1 text-xs text-slate-400">{d.label}</p>
                <p className="text-sm font-bold text-slate-800">{d.value}</p>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function HourlyForecast({ hourly, unit }) {
      if (hourly.length === 0) return null;
      return (
        <section className="mx-auto max-w-3xl px-4 pt-6 sm:px-6">
          <h2 className="mb-3 text-sm font-bold text-white/90">⏰ 시간별 예보 (3시간 간격)</h2>
          <Card className="overflow-x-auto">
            <div className="flex min-w-max gap-5 px-1">
              {hourly.map((h, i) => (
                <div key={i} className="flex flex-col items-center gap-1 text-center">
                  <span className="text-xs font-semibold text-slate-500">{i === 0 ? '지금' : h.label}</span>
                  <img src={iconUrl(h.icon)} alt={h.description} className="h-12 w-12" />
                  <span className="text-sm font-bold text-slate-800">{toDisplayTemp(h.tempC, unit)}°</span>
                </div>
              ))}
            </div>
          </Card>
        </section>
      );
    }

    function WeeklyForecast({ daily, unit }) {
      if (daily.length === 0) return null;
      const maxHigh = Math.max(...daily.map((d) => d.highC));
      const minLow = Math.min(...daily.map((d) => d.lowC));
      const range = Math.max(1, maxHigh - minLow);

      return (
        <section className="mx-auto max-w-3xl px-4 pb-4 pt-6 sm:px-6">
          <h2 className="mb-3 text-sm font-bold text-white/90">📅 예보 ({daily.length}일 · 무료 API 제공 범위)</h2>
          <Card className="divide-y divide-slate-100">
            {daily.map((d, i) => {
              const leftPct = ((d.lowC - minLow) / range) * 100;
              const widthPct = ((d.highC - d.lowC) / range) * 100;
              return (
                <div key={i} className="flex items-center gap-3 py-3 first:pt-1 last:pb-1">
                  <span className="w-14 shrink-0 text-sm font-semibold text-slate-700">{d.dayLabel}</span>
                  <img src={iconUrl(d.icon)} alt={d.description} className="h-8 w-8 shrink-0" />
                  <Badge className="w-14 shrink-0 justify-center text-sky-600">💧{d.precipitation}%</Badge>
                  <span className="w-8 shrink-0 text-right text-sm text-slate-400">{toDisplayTemp(d.lowC, unit)}°</span>
                  <div className="relative h-1.5 flex-1 rounded-full bg-slate-100">
                    <div
                      className="absolute h-1.5 rounded-full bg-gradient-to-r from-sky-300 to-orange-400"
                      style={{ left: `${leftPct}%`, width: `${widthPct}%` }}
                    />
                  </div>
                  <span className="w-8 shrink-0 text-sm font-bold text-slate-800">{toDisplayTemp(d.highC, unit)}°</span>
                </div>
              );
            })}
          </Card>
        </section>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || DEFAULT_API_KEY);
      const [showSettings, setShowSettings] = useState(false);

      const [location, setLocation] = useState(() => readCache(LOCATION_STORAGE) || DEFAULT_LOCATION);
      const [unit, setUnit] = useState('C');

      const [current, setCurrent] = useState(null);
      const [forecast, setForecast] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [searchError, setSearchError] = useState(null);
      const [locating, setLocating] = useState(false);

      const loadWeather = useCallback(async (loc, key) => {
        if (!key || !loc) return;
        setLoading(true);
        setError(null);
        try {
          const [weatherData, forecastData] = await Promise.all([
            fetchCurrentWeather(loc.lat, loc.lon, key),
            fetchForecast(loc.lat, loc.lon, key),
          ]);
          setCurrent(weatherData);
          setForecast(forecastData);
        } catch (err) {
          setError(err.message || '날씨 정보를 불러오지 못했습니다');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        if (apiKey) loadWeather(location, apiKey);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [apiKey, location]);

      const { hourly, daily } = useMemo(() => {
        if (!forecast || !current) return { hourly: [], daily: [] };
        const tz = current.timezone || 0;
        const todayKey = dateKey(toLocalDate(current.dt, tz));

        const hourlyItems = forecast.list.slice(0, 8).map((item) => {
          const localDate = toLocalDate(item.dt, tz);
          return {
            label: `${localDate.getUTCHours()}시`,
            tempC: item.main.temp,
            icon: item.weather[0].icon,
            description: item.weather[0].description,
          };
        });

        const groups = {};
        forecast.list.forEach((item) => {
          const localDate = toLocalDate(item.dt, tz);
          const key = dateKey(localDate);
          if (!groups[key]) groups[key] = [];
          groups[key].push({ ...item, localDate });
        });

        const dailyItems = Object.values(groups)
          .slice(0, 6)
          .map((items) => {
            const temps = items.map((i) => i.main.temp);
            const noonItem = items.reduce((best, cur) => {
              const bestDiff = Math.abs(best.localDate.getUTCHours() - 12);
              const curDiff = Math.abs(cur.localDate.getUTCHours() - 12);
              return curDiff < bestDiff ? cur : best;
            }, items[0]);
            return {
              dayLabel: formatDayLabel(items[0].localDate, todayKey),
              highC: Math.max(...temps),
              lowC: Math.min(...temps),
              icon: noonItem.weather[0].icon,
              description: noonItem.weather[0].description,
              precipitation: Math.round(Math.max(...items.map((i) => i.pop || 0)) * 100),
            };
          });

        return { hourly: hourlyItems, daily: dailyItems };
      }, [forecast, current]);

      function handleSaveApiKey(key) {
        const trimmed = key.trim();
        if (!trimmed) return;
        localStorage.setItem(API_KEY_STORAGE, trimmed);
        setApiKey(trimmed);
        setShowSettings(false);
      }

      function handleClearApiKey() {
        localStorage.removeItem(API_KEY_STORAGE);
        setApiKey('');
        setCurrent(null);
        setForecast(null);
        setShowSettings(false);
      }

      async function handleSearch(e) {
        e.preventDefault();
        const term = searchTerm.trim();
        if (!term || !apiKey) return;
        setSearching(true);
        setSearchError(null);
        setSearchResults([]);
        try {
          const results = await geocodeByName(term, apiKey);
          if (results.length === 0) {
            setSearchError('도시를 찾을 수 없습니다. 영문 이름으로도 시도해보세요.');
          } else {
            setSearchResults(results);
          }
        } catch (err) {
          setSearchError(err.message || '검색에 실패했습니다');
        } finally {
          setSearching(false);
        }
      }

      function selectLocation(result) {
        const displayName = (result.local_names && result.local_names.ko) || result.name;
        const loc = { lat: result.lat, lon: result.lon, name: displayName, country: result.country };
        setLocation(loc);
        writeCache(LOCATION_STORAGE, loc);
        setSearchResults([]);
        setSearchTerm('');
      }

      function handleUseMyLocation() {
        if (!navigator.geolocation) {
          setSearchError('이 브라우저는 위치 정보를 지원하지 않습니다');
          return;
        }
        setLocating(true);
        setSearchError(null);
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            try {
              const { latitude, longitude } = pos.coords;
              const results = await reverseGeocode(latitude, longitude, apiKey);
              const match = results[0];
              const displayName = match ? (match.local_names && match.local_names.ko) || match.name : '내 위치';
              const loc = { lat: latitude, lon: longitude, name: displayName, country: match && match.country };
              setLocation(loc);
              writeCache(LOCATION_STORAGE, loc);
            } catch (err) {
              setSearchError(err.message || '위치 정보를 불러오지 못했습니다');
            } finally {
              setLocating(false);
            }
          },
          () => {
            setSearchError('위치 권한이 거부되었습니다');
            setLocating(false);
          }
        );
      }

      if (!apiKey) {
        return <ApiKeySetup initialValue="" onSave={handleSaveApiKey} />;
      }

      return (
        <div className="min-h-screen bg-gradient-to-b from-sky-400 via-sky-500 to-sky-600">
          <Header locationName={location.name} unit={unit} onToggleUnit={setUnit} onOpenSettings={() => setShowSettings(true)} />

          <CitySearchBar
            searchTerm={searchTerm}
            onSearchTermChange={setSearchTerm}
            onSearch={handleSearch}
            searching={searching}
            results={searchResults}
            onSelectResult={selectLocation}
            onUseMyLocation={handleUseMyLocation}
            locating={locating}
            searchError={searchError}
          />

          {loading && (
            <div className="flex flex-col items-center justify-center gap-3 py-24">
              <Spinner className="h-8 w-8" />
              <p className="text-sm text-sky-50">날씨 정보를 불러오는 중...</p>
            </div>
          )}

          {!loading && error && (
            <div className="mx-auto max-w-3xl px-4 py-16 text-center sm:px-6">
              <p className="text-sm font-medium text-white">{error}</p>
              <Button variant="secondary" size="sm" className="mt-3" onClick={() => loadWeather(location, apiKey)}>
                다시 시도
              </Button>
            </div>
          )}

          {!loading && !error && current && (
            <React.Fragment>
              <CurrentWeatherHero current={current} unit={unit} />
              <WeatherDetailsGrid current={current} />
              <HourlyForecast hourly={hourly} unit={unit} />
              <WeeklyForecast daily={daily} unit={unit} />
            </React.Fragment>
          )}

          <Footer />

          <SettingsModal
            isOpen={showSettings}
            onClose={() => setShowSettings(false)}
            currentKey={apiKey}
            onSave={handleSaveApiKey}
            onClear={handleClearApiKey}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
