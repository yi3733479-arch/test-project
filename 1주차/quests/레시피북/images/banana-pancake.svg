<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="바나나팬케이크 일러스트">
  <rect width="800" height="500" fill="#F7F1E6"/>
  <ellipse cx="400" cy="330" rx="300" ry="130" fill="#EBE2D2"/>
  <ellipse cx="400" cy="322" rx="272" ry="118" fill="#FFFFFF"/>
  <ellipse cx="400" cy="322" rx="272" ry="118" fill="none" stroke="#DFD6C6" stroke-width="4"/>
  <ellipse cx="400" cy="318" rx="216" ry="88" fill="#FBF8F2"/>

  <!-- pancake stack -->
  <g>
    <ellipse cx="400" cy="340" rx="140" ry="40" fill="#B87A38"/>
    <rect x="260" y="310" width="280" height="30" fill="#B87A38"/>
    <ellipse cx="400" cy="310" rx="140" ry="40" fill="#DCA45C"/>
    <rect x="262" y="278" width="276" height="30" fill="#B87A38"/>
    <ellipse cx="400" cy="278" rx="138" ry="38" fill="#E3AE68"/>
    <rect x="266" y="246" width="268" height="30" fill="#B87A38"/>
    <ellipse cx="400" cy="246" rx="134" ry="37" fill="#E8B972"/>
    <ellipse cx="400" cy="244" rx="104" ry="26" fill="#EEC884" opacity="0.8"/>
  </g>

  <!-- banana slices -->
  <g>
    <circle cx="360" cy="240" r="22" fill="#F7E08A"/><circle cx="360" cy="240" r="9" fill="#EBCB62"/>
    <circle cx="410" cy="230" r="22" fill="#F7E08A"/><circle cx="410" cy="230" r="9" fill="#EBCB62"/>
    <circle cx="450" cy="248" r="22" fill="#F7E08A"/><circle cx="450" cy="248" r="9" fill="#EBCB62"/>
  </g>

  <!-- honey drip -->
  <path d="M320 244 q40 30 80 8 q50-22 90 8 q16 12 10 30 q-6 16-18 6" fill="none" stroke="#E5A227" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M498 262 q-4 40 6 56 q10 8 12-6 q2-24-8-50z" fill="#E5A227" opacity="0.9"/>

  <!-- nuts + cinnamon -->
  <g fill="#8A5A2B">
    <ellipse cx="380" cy="220" rx="8" ry="5" transform="rotate(20 380 220)"/>
    <ellipse cx="430" cy="215" rx="8" ry="5" transform="rotate(-25 430 215)"/>
  </g>
  <g fill="#8A5A2B" opacity="0.5">
    <circle cx="340" cy="262" r="3"/><circle cx="470" cy="226" r="3"/><circle cx="400" cy="262" r="3"/>
  </g>
</svg>
