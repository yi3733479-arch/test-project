<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="참치마요 덮밥 일러스트">
  <rect width="800" height="500" fill="#F6EFE2"/>
  <circle cx="400" cy="255" r="215" fill="#E7DCC9"/>

  <!-- bowl -->
