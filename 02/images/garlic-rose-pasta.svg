  <g fill="#FFF6E2">
    <circle cx="352" cy="286" r="9"/>
    <circle cx="452" cy="164" r="8"/>
    <circle cx="304" cy="240" r="8"/>
    <circle cx="496" cy="300" r="9"/>
    <circle cx="376" cy="368" r="8"/>
