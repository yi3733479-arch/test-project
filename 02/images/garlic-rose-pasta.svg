<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="마늘 로제 파스타 일러스트">
  <rect width="800" height="500" fill="#F3EEE6"/>
  <circle cx="400" cy="255" r="222" fill="#E6DED1"/>

  <!-- plate -->
