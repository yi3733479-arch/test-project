    <rect x="666" y="290" width="16" height="170" rx="8"/>
    <rect x="654" y="230" width="9" height="62" rx="4"/>
    <rect x="666" y="230" width="9" height="62" rx="4"/>
    <rect x="678" y="230" width="9" height="62" rx="4"/>
    <rect x="690" y="230" width="9" height="62" rx="4"/>
