<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음이음 - AI 심리상담</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 은 반드시 7.x (8.x는 인라인 text/babel 처리가 깨짐) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes bounce-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .dot { animation: bounce-dot 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 📦 Constants
    // ========================================
    // ⚠️ API 키를 코드에 하드코딩하지 마세요. 공개 저장소/공개 웹에 올리면
    // 키가 그대로 노출되어 타인이 요금을 쓸 수 있습니다. 설정(⚙️)에서 키를
    // 입력하면 브라우저 localStorage에만 저장됩니다.
    const DEFAULT_API_KEY = '';

    const API_KEY_STORAGE = 'counseling_api_key';
    const HISTORY_STORAGE = 'counseling_chat_history';
    const OPENAI_CHAT_URL = 'https://api.openai.com/v1/chat/completions';
    const MODEL = 'gpt-4o-mini';

    const CRISIS_HOTLINE = '109';

    const SYSTEM_PROMPT = `당신은 "마음이음"이라는 이름의 심리 상담 지원 AI입니다. 다음 원칙을 반드시 지키세요.
1. 따뜻하고 공감적인 태도로 경청하고, 상대방의 감정을 있는 그대로 인정(validate)하세요.
2. 성급한 조언이나 해결책 제시보다, 열린 질문으로 상대방이 스스로 생각을 정리하도록 도우세요.
3. 진단을 내리거나 약물을 권하지 마세요. 당신은 면허를 가진 전문가가 아니며, 전문 상담사·정신건강의학과 전문의의 상담을 대체할 수 없다는 점을 필요할 때 자연스럽게 알려주세요.
4. 대화 중 자살, 자해, 타인에 대한 위해 암시가 조금이라도 느껴지면, 공감을 먼저 표현한 뒤 반드시 대한민국 자살예방상담전화 "109"(24시간, 전화·문자 상담 가능)에 즉시 연락하거나 가까운 응급실을 방문하도록 안내하세요.
5. 존댓말을 사용하고, 짧고 따뜻한 문장으로 답하세요. 한 번에 너무 많은 질문을 쏟아내지 마세요.
6. 필요하다면 심호흡, 그라운딩 기법 등 간단한 자기 진정 방법을 제안할 수 있습니다.`;

    const WELCOME_MESSAGE = {
      id: 'welcome',
      role: 'assistant',
      content: '안녕하세요, 마음이음이에요. 오늘 마음은 좀 어떠셨어요? 편하게 이야기해주셔도 괜찮아요.',
    };

    const CRISIS_KEYWORDS = [
      '자살', '죽고싶', '죽고싶어', '죽고싶다', '자해', '목숨을끊', '살기싫',
      '사라지고싶', '극단적선택', '죽어버리고싶', '뛰어내리고싶',
    ];

    function containsCrisisKeyword(text) {
      const normalized = text.replace(/\s+/g, '');
      return CRISIS_KEYWORDS.some((kw) => normalized.includes(kw));
    }

    // ========================================
    // 🛠 Utility Helpers
    // ========================================
    let idCounter = 0;
    function generateId() {
      idCounter += 1;
      return `msg-${Date.now()}-${idCounter}`;
    }

    function readCache(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function writeCache(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // 저장 실패는 무시 (프라이빗 모드 등)
      }
    }

    // OpenAI Chat Completions 스트리밍(SSE) 호출
    async function streamChatCompletion(apiKey, messages, { onDelta, signal }) {
      const res = await fetch(OPENAI_CHAT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`,
        },
        body: JSON.stringify({ model: MODEL, messages, stream: true, temperature: 0.8 }),
        signal,
      });

      if (!res.ok || !res.body) {
        let message = `요청에 실패했습니다 (${res.status})`;
        try {
          const errData = await res.json();
          if (errData.error && errData.error.message) message = errData.error.message;
        } catch {
          // JSON 파싱 실패 시 기본 메시지 사용
        }
        throw new Error(message);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let fullText = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const json = JSON.parse(payload);
            const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
            if (delta) {
              fullText += delta;
              onDelta(fullText);
            }
          } catch {
            // 조각난 JSON은 다음 청크와 합쳐질 수 있으므로 무시
          }
        }
      }
      return fullText;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-teal-600 text-white hover:bg-teal-700 focus:ring-teal-400',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-400',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-100 focus:ring-slate-200',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm gap-1',
        md: 'px-4 py-2 text-sm gap-1.5',
        lg: 'px-5 py-2.5 text-base gap-2',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ value, onChange, placeholder, disabled = false, className = '' }) {
      return (
        <input
          type="text"
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          disabled={disabled}
          className={`w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 shadow-sm transition focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-300 disabled:bg-slate-100 ${className}`}
        />
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Spinner({ className = 'h-5 w-5' }) {
      return (
        <svg className={`animate-spin text-teal-600 ${className}`} viewBox="0 0 24 24" fill="none">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      );
    }

    function Modal({ isOpen, onClose, title, children }) {
      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        document.addEventListener('keydown', handleKeyDown);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          aria-label={title}
        >
          <div onClick={(e) => e.stopPropagation()} className="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
              <h2 className="text-lg font-bold text-slate-900">{title}</h2>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="rounded-full p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-300"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div className="max-h-[75vh] overflow-y-auto px-5 py-4">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header({ onOpenSettings, onNewChat }) {
      return (
        <header className="sticky top-0 z-30 border-b border-teal-100 bg-white/90 backdrop-blur">
          <div className="mx-auto flex max-w-2xl items-center justify-between px-4 py-3 sm:px-6">
            <div className="flex items-center gap-2">
              <span className="text-2xl">🕊️</span>
              <div>
                <h1 className="text-base font-bold text-slate-800">마음이음</h1>
                <p className="text-xs text-slate-400">AI 심리상담 지원 챗봇</p>
              </div>
            </div>
            <div className="flex items-center gap-1.5">
              <Button variant="ghost" size="sm" onClick={onNewChat}>🔄 새 대화</Button>
              <button
                onClick={onOpenSettings}
                aria-label="API 키 설정"
                className="rounded-full p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600"
              >
                ⚙️
              </button>
            </div>
          </div>
          <div className="bg-amber-50 px-4 py-1.5 text-center text-[11px] text-amber-700 sm:px-6">
            이 앱은 전문 상담을 대체하지 않아요 · 위기 상황이라면{' '}
            <a href={`tel:${CRISIS_HOTLINE}`} className="font-bold underline">
              {CRISIS_HOTLINE} 자살예방상담전화
            </a>{' '}
            (24시간)
          </div>
        </header>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function ApiKeySetup({ onSave }) {
      const [value, setValue] = useState('');
      return (
        <div className="flex min-h-screen items-center justify-center px-4">
          <Card className="w-full max-w-sm text-center">
            <p className="text-3xl">🔑</p>
            <h2 className="mt-2 text-lg font-bold text-slate-800">OpenAI API 키가 필요해요</h2>
            <p className="mt-1 text-sm text-slate-500">
              <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer" className="font-semibold text-teal-600 underline">
                platform.openai.com
              </a>
              에서 발급받은 키를 입력하세요.
            </p>
            <div className="mt-4 text-left">
              <Input value={value} onChange={(e) => setValue(e.target.value)} placeholder="sk-... 로 시작하는 API 키" />
            </div>
            <Button variant="primary" size="md" className="mt-4 w-full" disabled={!value.trim()} onClick={() => onSave(value)}>
              저장하고 시작하기
            </Button>
          </Card>
        </div>
      );
    }

    function SettingsModal({ isOpen, onClose, currentKey, onSave, onClear }) {
      const [value, setValue] = useState(currentKey || '');
      useEffect(() => {
        if (isOpen) setValue(currentKey || '');
      }, [isOpen, currentKey]);

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="API 키 설정">
          <p className="mb-3 text-sm text-slate-500">
            <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer" className="text-teal-600 underline">
              platform.openai.com
            </a>
            에서 발급받은 키를 입력하세요. 대화 내용은 이 브라우저(localStorage)와 OpenAI 서버로 전송되어 응답을 생성하는 데만 사용돼요.
          </p>
          <Input value={value} onChange={(e) => setValue(e.target.value)} placeholder="API 키" />
          <div className="mt-4 flex gap-2">
            <Button variant="primary" size="sm" className="flex-1" disabled={!value.trim()} onClick={() => onSave(value)}>
              저장
            </Button>
            <Button variant="ghost" size="sm" className="!text-rose-500 hover:!bg-rose-50" onClick={onClear}>
              키 삭제
            </Button>
          </div>
        </Modal>
      );
    }

    function CrisisAlert() {
      return (
        <div className="mx-auto max-w-[85%] rounded-2xl border-2 border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 shadow-sm">
          <p className="font-bold">💙 혼자 견디지 않으셨으면 해요</p>
          <p className="mt-1 leading-relaxed">
            지금 많이 힘드신 것 같아요. 이런 마음이 들 땐 전문가와 직접 이야기 나누는 게 큰 도움이 됩니다. 아래 번호로 24시간
            언제든 연락하실 수 있어요.
          </p>
          <a
            href={`tel:${CRISIS_HOTLINE}`}
            className="mt-2 inline-block rounded-full bg-rose-600 px-4 py-1.5 text-xs font-bold text-white hover:bg-rose-700"
          >
            📞 {CRISIS_HOTLINE} 자살예방상담전화 바로 걸기
          </a>
        </div>
      );
    }

    function TypingIndicator() {
      return (
        <div className="flex items-center gap-1 rounded-2xl bg-white px-4 py-3 shadow-sm ring-1 ring-slate-100">
          <span className="dot h-1.5 w-1.5 rounded-full bg-slate-400" />
          <span className="dot h-1.5 w-1.5 rounded-full bg-slate-400" />
          <span className="dot h-1.5 w-1.5 rounded-full bg-slate-400" />
        </div>
      );
    }

    function MessageBubble({ message }) {
      if (message.role === 'crisis') return <CrisisAlert />;

      const isUser = message.role === 'user';
      return (
        <div className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
          <div
            className={`max-w-[80%] whitespace-pre-wrap rounded-2xl px-4 py-2.5 text-sm leading-relaxed shadow-sm ${
              isUser ? 'bg-teal-600 text-white' : 'bg-white text-slate-700 ring-1 ring-slate-100'
            }`}
          >
            {message.content}
          </div>
        </div>
      );
    }

    function ChatWindow({ messages, isSending }) {
      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, [messages, isSending]);

      return (
        <main className="mx-auto flex max-w-2xl flex-1 flex-col gap-3 overflow-y-auto px-4 py-4 sm:px-6">
          {messages.map((m) => (
            <MessageBubble key={m.id} message={m} />
          ))}
          {isSending && (
            <div className="flex justify-start">
              <TypingIndicator />
            </div>
          )}
          <div ref={bottomRef} />
        </main>
      );
    }

    function ChatInput({ value, onChange, onSend, onStop, isSending, disabled }) {
      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          onSend();
        }
      }

      return (
        <div className="sticky bottom-0 border-t border-slate-200 bg-white px-4 py-3 sm:px-6">
          <div className="mx-auto flex max-w-2xl items-end gap-2">
            <textarea
              value={value}
              onChange={onChange}
              onKeyDown={handleKeyDown}
              disabled={disabled}
              placeholder="지금 느끼는 마음을 편하게 적어보세요... (Shift+Enter 줄바꿈)"
              rows={1}
              className="max-h-32 flex-1 resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-300 disabled:bg-slate-100"
            />
            {isSending ? (
              <Button variant="danger" size="md" onClick={onStop}>중단</Button>
            ) : (
              <Button variant="primary" size="md" disabled={disabled || !value.trim()} onClick={onSend}>
                전송
              </Button>
            )}
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || DEFAULT_API_KEY);
      const [showSettings, setShowSettings] = useState(false);

      const [messages, setMessages] = useState(() => readCache(HISTORY_STORAGE) || [WELCOME_MESSAGE]);
      const [input, setInput] = useState('');
      const [isSending, setIsSending] = useState(false);
      const [error, setError] = useState(null);
      const abortControllerRef = useRef(null);

      useEffect(() => {
        writeCache(HISTORY_STORAGE, messages);
      }, [messages]);

      const handleSend = useCallback(async () => {
        const text = input.trim();
        if (!text || isSending || !apiKey) return;

        setInput('');
        setError(null);

        const userMsg = { id: generateId(), role: 'user', content: text };
        let nextMessages = [...messages, userMsg];
        if (containsCrisisKeyword(text)) {
          nextMessages = [...nextMessages, { id: generateId(), role: 'crisis', content: '' }];
        }
        setMessages(nextMessages);

        const apiMessages = [
          { role: 'system', content: SYSTEM_PROMPT },
          ...nextMessages
            .filter((m) => m.role === 'user' || m.role === 'assistant')
            .map((m) => ({ role: m.role, content: m.content })),
        ];

        const assistantId = generateId();
        setMessages((prev) => [...prev, { id: assistantId, role: 'assistant', content: '' }]);
        setIsSending(true);

        const controller = new AbortController();
        abortControllerRef.current = controller;

        try {
          await streamChatCompletion(apiKey, apiMessages, {
            signal: controller.signal,
            onDelta: (fullText) => {
              setMessages((prev) => prev.map((m) => (m.id === assistantId ? { ...m, content: fullText } : m)));
            },
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            setError(err.message || '응답을 받아오지 못했습니다');
            setMessages((prev) => prev.filter((m) => m.id !== assistantId));
          }
        } finally {
          setIsSending(false);
          abortControllerRef.current = null;
        }
      }, [input, isSending, apiKey, messages]);

      function handleStop() {
        abortControllerRef.current?.abort();
      }

      function handleNewChat() {
        abortControllerRef.current?.abort();
        setMessages([WELCOME_MESSAGE]);
        setError(null);
        setInput('');
      }

      function handleSaveApiKey(key) {
        const trimmed = key.trim();
        if (!trimmed) return;
        localStorage.setItem(API_KEY_STORAGE, trimmed);
        setApiKey(trimmed);
        setShowSettings(false);
      }

      function handleClearApiKey() {
        localStorage.removeItem(API_KEY_STORAGE);
        setApiKey('');
        setShowSettings(false);
      }

      if (!apiKey) {
        return <ApiKeySetup onSave={handleSaveApiKey} />;
      }

      return (
        <div className="flex min-h-screen flex-col bg-slate-100">
          <Header onOpenSettings={() => setShowSettings(true)} onNewChat={handleNewChat} />

          <ChatWindow messages={messages} isSending={isSending} />

          {error && (
            <div className="mx-auto w-full max-w-2xl px-4 pb-1 sm:px-6">
              <p className="rounded-lg bg-rose-50 px-3 py-2 text-xs font-medium text-rose-600">⚠ {error}</p>
            </div>
          )}

          <ChatInput
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onSend={handleSend}
            onStop={handleStop}
            isSending={isSending}
            disabled={isSending}
          />

          <SettingsModal
            isOpen={showSettings}
            onClose={() => setShowSettings(false)}
            currentKey={apiKey}
            onSave={handleSaveApiKey}
            onClear={handleClearApiKey}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
